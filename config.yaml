# Central configuration for the football analytics pipeline.
# All relative paths are resolved against the repository root.

paths:
  input_video: data/raw/0bfacc_0.mp4      # see README "Data" for where to get it
  output_dir: outputs
  models_dir: models
  datasets_dir: data/datasets

device: auto            # auto | cpu | cuda | cuda:0 | mps

models:
  # Football-specific detector (classes: ball, goalkeeper, player, referee).
  # Download or fine-tune it (README "Models"). If missing, the COCO fallback is used.
  player_detector: models/football-player-detection.pt
  # Optional dedicated ball detector; if missing, the player detector is used for the ball too.
  ball_detector: models/football-ball-detection.pt
  # Pitch keypoint model (stage 5).
  pitch_detector: models/football-pitch-detection.pt
  # General COCO model, auto-downloaded from the Ultralytics GitHub releases.
  fallback_detector: models/yolo11n.pt

detection:
  conf: 0.3
  iou: 0.5
  imgsz: 1280
  # Map model class names -> canonical classes. Unlisted classes are dropped.
  class_map:
    ball: ball
    football: ball
    goalkeeper: goalkeeper
    player: player
    referee: referee
    # COCO fallback model has no referee/goalkeeper classes
    person: player
    sports ball: ball

ball:
  use_slicing: true      # tile the frame so the tiny ball is seen at higher resolution
  slice_wh: [640, 640]
  overlap_wh: [128, 128]
  conf: 0.15
  iou: 0.1
  imgsz: 640

tracking:
  # ByteTrack (roboflow `trackers` package). A new track needs confidence above
  # both thresholds below, so keep them close to detection.conf.
  high_conf_det_threshold: 0.4
  track_activation_threshold: 0.4
  minimum_consecutive_frames: 2   # frames before a new ID is confirmed
  lost_track_buffer_s: 2.0        # keep a lost player's ID alive this long (occlusions)
  minimum_iou_threshold: 0.1

ball_interpolation:
  max_gap_frames: 25              # fill gaps up to ~1 s at 25 fps; longer gaps stay empty
  max_speed_px_per_frame: 80      # a detection this far from BOTH neighbours is a false positive

teams:
  crops_per_track: 12        # shirt crops sampled evenly along each track
  crop_top: 0.15             # shirt region as fractions of the box height ...
  crop_bottom: 0.50
  crop_side: 0.20            # ... and width trimmed from each side
  min_crop_px: 4             # skip crops smaller than this (far-away players)
  flag_colour_outliers: true # tracks whose colour fits neither team become "other" (referee/GK
                             # when the detector has no such classes, e.g. the COCO fallback)
  outlier_factor: 3.0        # x median player distance to its team colour
  min_outlier_distance: 25.0 # Lab units

output:
  max_frames: null       # limit frames for quick runs (null = whole clip)

pitch:
  length_m: 105.0
  width_m: 68.0
  keypoint_conf: 0.5            # ignore keypoints the model is less sure about
  min_keypoints: 4              # a homography needs at least 4 point pairs
  ransac_threshold_m: 1.0       # keypoints further than this from the fit are outliers
  max_reprojection_error_m: 1.5 # reject a frame's homography above this mean error
  smoothing_window: 7           # frames, centred (offline, so no lag during pans)
  max_gap_frames: 25            # interpolate the mapping across frames with too few keypoints
  smoothing_grid_y: [0.4, 0.95] # image rows (fraction of height) used to smooth the mapping
  out_of_bounds_margin_m: 5.0   # positions further outside the pitch are discarded
