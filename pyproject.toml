[project]
name = "football-analytics"
version = "0.1.0"
description = "Broadcast football analytics with YOLO, ByteTrack and homography"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "D1", "ANN0", "ANN2"]
ignore = [
    "D105", "D107",   # magic methods / __init__ docstrings
    "D102",           # trivial RunPaths properties
]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: safe as default arguments
extend-immutable-calls = ["src.pitch.template.PitchTemplate", "src.pitch.draw.PitchCanvas",
                          "src.pipeline.PipelineOptions", "PitchTemplate", "PitchCanvas", "PipelineOptions"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1", "ANN"]
"streamlit_app.py" = ["D1"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
